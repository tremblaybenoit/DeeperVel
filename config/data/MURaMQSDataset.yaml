# Dataset
dataset:
  yz:
    # Path to data
    path: "E:\\Data/ISSI_Team_Flows/Matthias/SSD_25x8Mm_16_pdmp_1_ISSI_Flows/2D"
    type: "directory"
    # Reader
    io:
      # Partial instantiation
      _partial_: True
      # Target class
      _target_: track.data.io.MURaMQSDataset
      # Path to data
      path: ${data.dataset.yz.path}
      # Slice type
      dataset: 'yz'
    # Variables
    variables:
      Bx: ${data.variables.Bx}
      By: ${data.variables.By}
      Bz: ${data.variables.Bz}
      vx: ${data.variables.vx}
      vy: ${data.variables.vy}
      vz: ${data.variables.vz}
    # Statistics
    statistics:
      # Path to statistics
      path: ${data.dataset.yz.path}/stats_yz.pkl
      type: "file"
  tau:
