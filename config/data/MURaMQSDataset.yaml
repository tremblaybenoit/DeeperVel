# Data loader
_recursive_: False
# _target_: track.model.data_loader.LazyDataModule

# Dataset
dataset:
  yz:
    # Path to data
    path: "E:\\Data/ISSI_Team_Flows/Matthias/SSD_25x8Mm_16_pdmp_1_ISSI_Flows/2D"
    type: "directory"
    # Reader
    io:
      # Partial instantiation
      _partial_: True
      # Target class
      _target_: track.data.io.MURaMQSDataset
      # Path to data
      path: ${data.dataset.yz.path}
      # Slice type
      dataset: 'yz'
    # Variables
    variables:
      Bx: ${data.variables.Bx}
      By: ${data.variables.By}
      Bz: ${data.variables.Bz}
      vx: ${data.variables.vx}
      vy: ${data.variables.vy}
      vz: ${data.variables.vz}
    # Statistics
    statistics:
      # Path to statistics
      path: ${data.dataset.yz.path}/stats_yz.pkl
      type: "file"
  tau:
    # Path to data
    path: "E:\\Data/ISSI_Team_Flows/Matthias/SSD_25x8Mm_16_pdmp_1_ISSI_Flows/2D"
    type: "directory"
    # Reader
    io:
      # Partial instantiation
      _partial_: True
      # Target class
      _target_: track.data.io.MURaMQSDataset
      # Path to data
      path: ${data.dataset.tau.path}
      # Slice type
      dataset: 'tau'
    # Variables
    variables:
      Bx: ${data.variables.Bx}
      By: ${data.variables.By}
      Bz: ${data.variables.Bz}
      vx: ${data.variables.vx}
      vy: ${data.variables.vy}
      vz: ${data.variables.vz}
    # Statistics
    statistics:
      # Path to statistics
      path: ${data.dataset.tau.path}/stats_tau.pkl
      type: "file"
  # Continuum intensity dataset
  I500:
    # Path to data
    path: "E:\\Data/ISSI_Team_Flows/Matthias/SSD_25x8Mm_16_pdmp_1_ISSI_Flows/2D"
    type: "directory"
    # Reader
    io:
      # Partial instantiation
      _partial_: True
      # Target class
      _target_: track.data.io.MURaMQSDataset
      # Path to data
      path: ${data.dataset.I500.path}
      # Slice type
      dataset: 'I500'
    # Variables
    variables:
      I500: ${data.variables.I500}
    # Statistics
    statistics:
      # Path to statistics
      path: ${data.dataset.yz.path}/stats_I500.pkl
      type: "file"

# Data loader
loader:
  # Data loader
  _recursive_: False
  _target_: track.model.data_loader.LazyDataModule
  # Input data
  input:
    # Dataset
    - dataset: ${data.dataset.yz}
      # Variables
      variables:
        Bx: ${data.dataset.yz.variables.Bx}
        By: ${data.dataset.yz.variables.By}
        Bz: ${data.dataset.yz.variables.Bz}
        vz: ${data.dataset.yz.variables.vz}
      # Heights
      slices: [0]
      # Time steps
      dt: [0, 1]
    - dataset: ${data.dataset.I500}
      # Variables
      variables:
        I500: ${data.dataset.I500.variables.I500}
      # Heights
      slices: [0]
      # Time steps
      dt: [0, 1]
  # Output data
  output:
    # Dataset
    - dataset: ${data.dataset.yz}
      # Variables
      variables:
        vx: ${data.dataset.yz.variables.vx}
        vy: ${data.dataset.yz.variables.vy}
      # Heights
      slices: [0]
      # Time steps
      dt: [0]
  # Split
  split:
    # Number of samples to use for training
    train: 2560
    # Number of samples to use for validation
    valid: 640
    # Number of samples to use for testing (0 = use all remaining data, excluding train and valid patches)
    test: 0
    # Batch size when training
    batch_size: 32
    # Patches to use for training
    patches: ${data.preparation.colocate.output.patches.path}
  # Apply geometric augmentation in the x/y plane
  augment: false


# Preparation steps
preparation:
  # Compute statistics
  statistics:
    # Method (statistics, statistics_by_chunks, etc.)
    method:
      _target_: track.data.statistics.statistics
      _partial_: true
    # Input dataset(s)
    input:
      - ${data.dataset.I500}
      - ${data.dataset.yz}
      - ${data.dataset.tau}
    # Output(s)
    output:
      # Data source
      - ${data.dataset.I500.statistics}
      - ${data.dataset.yz.statistics}
      - ${data.dataset.tau.statistics}
    # Invariance
    transverse_invariance: true
  # Training set patches
  colocate:
    # Input
    input:
      # Data source
      data: ${data.loader.input[0].dataset.io}
      # Patches
      patches:
        # Number of samples
        n_samples: 1000
        # Size of patches
        size: [48, 48]
        # Timesteps
        t_range: [0, 300]
        # Time steps
        dt: [0, 1]
    # Output
    output:
      # Patches
      patches:
        # Path
        path: ${paths.checkpoint_dir}/patches.pkl
        type: "file"


# MHD variables and their transformations
variables:
  I500:
    # Variable(s) to use to compute
    dependency: ['I500']
    # Transformations (rotations, sharpening, etc.)
    transform:
      # Partial instantiation
      _partial_: True
      _target_: track.data.transformations.identity
    # Scaling (factor multiplication, normalization, standardization, etc.)
    scaling:
      # Partial instantiation
      _partial_: True
      _target_: track.data.transformations.mean_stdev
