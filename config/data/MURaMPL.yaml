# Data loader
_recursive_: False
_target_: track.model.data_loader.MuramARDataModule

# Raw data
source:
  # Path to data
  path: "../data/MURaMQS"
  # Reader
  io:
    # Partial instantiation
    _partial_: True
    # Target class
    _target_: retrieval.data.io.MURaMQSDataset

# Data loader
loader:
  # Data loader
  _recursive_: False
  _target_: retrieval.model.data_loader.ZarrDataModule
  # Input data
  input:
    # Variables
    variables: [ic, Bx, By, Bz, vz]
    # Heights
    h: [0]
    # Time steps
    t: [0, 1]
    # Code to read files
    io: ${data.preparation.statistics.input.data}
    # Transformations (rotations, sharpening, etc.)
    transform:
      # Partial instantiation
      _partial_: True
      _target_: retrieval.data.transformations.identity
    # Scaling (factor multiplication, normalization, standardization, etc.)
    scaling:
      # Partial instantiation
      _partial_: True
      _target_: retrieval.data.transformations.mean_stdev
  # Output data
  output:
    # Variables
    variables: [vx, vy]
    # Heights
    h: [0]
    # Time steps
    t: [0]
    # Code to read files
    io: ${data.preparation.statistics.input.data}
    # Transformations (rotations, sharpening, etc.)
    transform:
      # Partial instantiation
      _partial_: True
      _target_: retrieval.data.transformations.identity
    # Scaling (factor multiplication, normalization, standardization, etc.)
    scaling:
      # Partial instantiation
      _partial_: True
      _target_: retrieval.data.transformations.mean_stdev
  # Stats
  stats: ${data.preparation.statistics.output.data.path}
  # Split
  split:
    # Fraction of data to use for training
    train: 0.6
    # Fraction of data to use for validation
    valid: 0.2
    # Fraction of data to use for testing
    test: 0.2
    # Batch size when training
    batch_size: 32
    # Patches
    patches:
      # Number of samples
      n_samples: 1000
      # Size of patches
      size: [48, 48]

# Preparation steps
preparation:
  # Reformat files
  preprocessing:
    method:
      # Partial instantiation
      _partial_: True
      _target_: retrieval.data.preprocessing.reformat
    # Input
    input:
      # Data
      data:
        # File splitting from parallelization
        path: ${data.dir}/obsfiles/
        type: "directory"
        # Code to read files
        io:
          # Partial instantiation
          _partial_: True
          _target_: retrieval.data.io.MidasRadianceDataset
    # Output
    output:
      # Data
      data:
        # Prefix of filenames
        path: ${data.dir}/radiance
        type: "directory"
        # Code to read files
        io:
          # Partial instantiation
          _partial_: True
          _target_: retrieval.data.io.ZarrDataset
          # Parameters
          params:
            # Chunk size
            chunks:
              # Variables
              amsua: [1000, 1]
  # Compute statistics
  statistics:
    # Input
    input:
      # Path
      data: ${data.dataset.radiance.preparation.preprocessing.output.data}
    # Output
    output:
      # Values
      data:
        # Path
        path: ${data.dir}/radiance_stats.pkl
        type: "file"
  # Dataframe of colocated files
  colocation:
    method:
      # Partial instantiation
      _partial_: True
      _target_: retrieval.data.colocation.minimize_distance
    input:
      radiance: ${data.dataset.radiance.files.data}
      state: ${data.dataset.state.files.data}
    output:
      data:
        # File with colocation information
        path: ${data.dir}/colocations.csv
        type: "file"
