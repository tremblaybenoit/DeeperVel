# Data loader
_recursive_: False
_target_: track.model.data_loader.MuramARDataModule

# Raw data
source:
  # Path to data
  path: "../data/MURaMQS"
  type: "directory"
  # Reader
  io:
    # Partial instantiation
    _partial_: True
    # Target class
    _target_: retrieval.data.io.MURaMQSDataset

# Data loader
loader:
  # Data loader
  _recursive_: False
  _target_: retrieval.model.data_loader.ZarrDataModule
  # Input data
  input:
    # Variables
    variables:
      ic: ${data.variables.ic}
      Bx: ${data.variables.Bx}
      By: ${data.variables.By}
      Bz: ${data.variables.Bz}
      vz: ${data.variables.vz}
    # Heights
    h: [ 0 ]
    # Time steps
    t: [0, 1]
    # Code to read files
    io: ${data.preparation.statistics.input.data}
  # Output data
  output:
    # Variables
    variables:
      vx: ${data.variables.vx}
      vy: ${data.variables.vy}
    # Heights
    h: [ 0 ]
    # Time steps
    t: [0]
    # Code to read files
    io: ${data.preparation.statistics.input.data}
  # Stats
  stats: ${data.preparation.statistics.output.data.path}
  # Split
  split:
    # Fraction of data to use for training
    train: 0.6
    # Fraction of data to use for validation
    valid: 0.2
    # Fraction of data to use for testing
    test: 0.2
    # Batch size when training
    batch_size: 32
    # Patches
    patches:
      # Number of samples
      n_samples: 1000
      # Size of patches
      size: [48, 48]

# Preparation steps
preparation:
  # Compute statistics
  statistics:
    # Input
    input:
      # Path
      data: ${data.source}
    # Output
    output:
      # Values
      data:
        # Path
        path: ${data.dir}/radiance_stats.pkl
        type: "file"

# MHD variables and their transformations
variables:
  ic:
    # Variable(s) to use to compute
    use: [ic]
    # Transformations (rotations, sharpening, etc.)
    transform:
      # Partial instantiation
      _partial_: True
      _target_: retrieval.data.transformations.identity
    # Scaling (factor multiplication, normalization, standardization, etc.)
    scaling:
      # Partial instantiation
      _partial_: True
      _target_: retrieval.data.transformations.mean_stdev
  Bx:
    # Variable(s) to use to compute
    use: [Bx]
    # Transformations (rotations, sharpening, etc.)
    transform:
      # Partial instantiation
      _partial_: True
      _target_: retrieval.data.transformations.identity
    # Scaling (factor multiplication, normalization, standardization, etc.)
    scaling:
      # Partial instantiation
      _partial_: True
      _target_: retrieval.data.transformations.mean_stdev
  By:
    # Variable(s) to use to compute
    use: [By]
    # Transformations (rotations, sharpening, etc.)
