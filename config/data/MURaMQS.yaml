# Data loader
_recursive_: False
_target_: track.model.data_loader.LazyDataModule

# Datasets
# Current implementation supports one dataset at a time for input and output
dataset:
  yz:
    # Path to data
    path: "E:\\Data/ISSI_Team_Flows/Matthias/SSD_25x8Mm_16_pdmp_1_ISSI_Flows/2D"
    type: "directory"
    # Reader
    io:
      # Partial instantiation
      _partial_: True
      # Target class
      _target_: track.data.io.MURaMQSDataset
      # Path to data
      path: ${data.dataset.yz.path}
      # Slice type
      dataset: 'yz'
    # Variables
    variables:
      I500: ${data.variables.I500}
      Bx: ${data.variables.Bx}
      By: ${data.variables.By}
      Bz: ${data.variables.Bz}
      vx: ${data.variables.vx}
      vy: ${data.variables.vy}
      vz: ${data.variables.vz}
    # Statistics
    statistics:
      # Path to statistics
      path: ${data.dataset.yz.path}/stats_yz.pkl
      type: "file"
  tau:
    # Path to data
    path: "../data/MURaMQS"
    type: "directory"
    # Reader
    io:
      # Partial instantiation
      _partial_: True
      # Target class
      _target_: track.data.io.MURaMQSDataset
      # Path to data
      path: ${data.dataset.tau.path}
      # Slice type
      dataset: 'tau'
    # Variables
    variables:
      I500: ${data.variables.I500}
      Bx: ${data.variables.Bx}
      By: ${data.variables.By}
      Bz: ${data.variables.Bz}
      vx: ${data.variables.vx}
      vy: ${data.variables.vy}
      vz: ${data.variables.vz}
    # Statistics
    statistics:
      # Path to statistics
      path: ${data.dataset.tau.path}/stats_tau.pkl
      type: "file"

# Data loader
loader:
  # Data loader
  _recursive_: False
  _target_: track.model.data_loader.ZarrDataModule
  # Input data
  input:
    # Dataset
    dataset: ${data.dataset.yz}
    # Variables
    variables:
      I500: ${data.dataset.yz.variables.I500}
      Bx: ${data.dataset.yz.variables.Bx}
      By: ${data.dataset.yz.variables.By}
      Bz: ${data.dataset.yz.variables.Bz}
      vz: ${data.dataset.yz.variables.vz}
    # Heights
    slices: [0]
    # Time steps
    dt: [0, 1]
  # Output data
  output:
    # Dataset
    dataset: ${data.dataset.yz}
    # Variables
    variables:
      vx: ${data.dataset.yz.variables.vx}
      vy: ${data.dataset.yz.variables.vy}
    # Heights
    slices: [0]
    # Time steps
    dt: [0]
  # Split
  split:
    # Fraction of data to use for training
    train: 0.6
    # Fraction of data to use for validation
    valid: 0.2
    # Fraction of data to use for testing
    test: 0.2
    # Batch size when training
    batch_size: 32
    # Patches to use for training
    patches: ${data.preparation.colocate.output.patches.path}
  # Apply geometric augmentation in the x/y plane
  augmentation:
    # Partial instantiation
    _partial_: True
    # Target class
    _target_: track.data.transformations.GeometricVectorAugmentation


# Preparation steps
preparation:
  # Compute statistics
  statistics:
    # Input
    input:
      - ${data.dataset.yz}
      - ${data.dataset.tau}
    # Output
    output:
      # Data source
      - ${data.dataset.yz.statistics}
      - ${data.dataset.tau.statistics}
  # Training set patches
  colocate:
    # Input
    input:
      # Data source
      data: ${data.loader.input.dataset.io}
      # Patches
      patches:
        # Number of samples
        n_samples: 1000
        # Size of patches
        size: [48, 48]
        # Timesteps
        t_range: [0, 300]
        # Time steps
        dt: ${data.loader.input.dt}
    # Output
    output:
      # Patches
      patches:
        # Path
        path: ${paths.checkpoint_dir}/patches.pkl
        type: "file"


# MHD variables and their transformations
variables:
  I500:
    # Variable(s) to use to compute
    dependency: ['I500']
    # Transformations (rotations, sharpening, etc.)
    transform:
      # Partial instantiation
      _partial_: True
      _target_: track.data.transformations.identity
    # Scaling (factor multiplication, normalization, standardization, etc.)
    scaling:
      # Partial instantiation
      _partial_: True
      _target_: track.data.transformations.mean_stdev
  Bx:
    # Variable(s) to use to compute
    dependency: ['Bx']
