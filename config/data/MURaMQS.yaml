# Dataset
dataset:
  # Continuum intensity dataset
  I500:
    # Directory containing the data files
    dir: E:\\Data/ISSI_Team_Flows/Matthias/SSD_25x8Mm_16_pdmp_1_ISSI_Flows/2D
    # Path to data files
    path:
      _target_: track.data.io.glob_MURaM
      file_pattern: ${.dir}/I_out.{{iter:06d}}
      slices: ${.slices}
    # Available slices
    slices: [0]
    # Properties
    properties:
      dtype: 'float32'
      nx: 1536
      ny: 1536
      dx: 16
      dy: 16
      dstep: 50
      dt: 10
      nt: 361
      iter_start: 0
      iter_end: 18000
    # Variables
    variables:
      # Continuum intensity at 500 nm
      I500:
        # Path to files
        path: ${..path}
        # Properties
        properties: ${..properties}
        # Loading function
        load:
          _target_: data.io.load_MURaM
          index: 0
        # Normalization function and parameters
        normalization:
          # Function
          _target_: inverse.data.transformations.mean_stdev
          _partial_: true
          stats:
            _target_: inverse.data.statistics.read_statistics_var
            path: ${..statistics.path}
            var: 'I500'
          dtype: ${data.dtype}
    # Statistics
    statistics:
      # Path to statistics
      path: ${.dir}/stats_I500.pkl
      type: "file"

  # Geometrical slices dataset
  yz:
    # Directory containing the data files
    dir: E:\\Data/ISSI_Team_Flows/Matthias/SSD_25x8Mm_16_pdmp_1_ISSI_Flows/2D
    # Path to data files
    path:
      _target_: track.data.io.glob_MURaM
      file_pattern: ${.dir}/yz_slice_{{slice:04d}}.{{iter:06d}}
      slices: ${.slices}
    # Available slices
    slices: [384, 400]
    # Properties
    properties: ${data.MURaMQS.I500.properties}
    # Variables
    variables:
      # Magnetic field components
      Bx:
        # Loading function
        load:
          _target_: data.io.load_MURaM
          index: 7
        normalization:
          # Function
          _target_: inverse.data.transformations.mean_stdev
          _partial_: true
          stats:
            _target_: inverse.data.statistics.read_statistics_var
            path: ${..statistics.path}
            var: 'Bx'
          dtype: ${data.dtype}
      By:
        # Loading function
        load:
          _target_: data.io.load_MURaM
          index: 6
        normalization:
          # Function
          _target_: inverse.data.transformations.mean_stdev
          _partial_: true
          stats:
            _target_: inverse.data.statistics.read_statistics_var
            path: ${..statistics.path}
            var: 'By'
          dtype: ${data.dtype}
      Bz:
        # Loading function
        load:
          _target_: data.io.load_MURaM
          index: 5
        normalization:
          # Function
          _target_: inverse.data.transformations.mean_stdev
          _partial_: true
          stats:
            _target_: inverse.data.statistics.read_statistics_var
            path: ${..statistics.path}
            var: 'Bz'
          dtype: ${data.dtype}
      # Velocity components
      vx:
        # Loading function
        load:
          _target_: data.io.load_MURaM
          index: 3
        normalization:
          # Function
          _target_: inverse.data.transformations.mean_stdev
          _partial_: true
          stats:
            _target_: inverse.data.statistics.read_statistics_var
            path: ${..statistics.path}
            var: 'vx'
          dtype: ${data.dtype}
      vy:
        # Loading function
        load:
          _target_: data.io.load_MURaM
          index: 2
        normalization:
          # Function
          _target_: inverse.data.transformations.mean_stdev
          _partial_: true
          stats:
            _target_: inverse.data.statistics.read_statistics_var
            path: ${..statistics.path}
            var: 'vy'
          dtype: ${data.dtype}
      vz:
        # Loading function
        load:
          _target_: data.io.load_MURaM
          index: 1
        normalization:
          # Function
          _target_: inverse.data.transformations.mean_stdev
          _partial_: true
          stats:
            _target_: inverse.data.statistics.read_statistics_var
            path: ${..statistics.path}
            var: 'vz'
          dtype: ${data.dtype}
    # Statistics
    statistics:
      # Path to statistics
      path: ${..path}/stats_yz.pkl
      type: "file"
  # Optical depth slices dataset
  tau:
    # Directory containing the data files
    dir: E:\\Data/ISSI_Team_Flows/Matthias/SSD_25x8Mm_16_pdmp_1_ISSI_Flows/2D
    # Path to data files
    path:
      _target_: track.data.io.glob_MURaM
      file_pattern: ${.dir}/tau_{{slice:04d}}.{{iter:06d}}
      slices: ${.slices}
    # Available slices
    slices: [0.001, 0.0001]
    # Properties
    properties: ${data.MURaMQS.I500.properties}
    # Variables
    variables: ${data.MURaMQS.yz.variables}
    # Statistics
    statistics:
      # Path to statistics
      path: ${.dir}/stats_tau.pkl
      type: "file"