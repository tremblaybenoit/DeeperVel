# Note: The order of defaults determines the order in which configs override each other.
defaults:
  - data: muramar
  - hydra: default
  - paths: default
  - model: deepvel
  - trainer: default
  - callbacks: default
  - logger: default
  - _self_

# Task name. Note that it determines the output directory path
task_name: "deepvel"  # Experiment
task_seed: 3110  # For reproducibility
