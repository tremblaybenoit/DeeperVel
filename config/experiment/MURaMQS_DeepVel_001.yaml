# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /data: MURaMQS
  - override /loader: default
  - override /paths: default
  - override /hydra: default
  - override /model: DeepVel
  - override /trainer: gpu
  - override /callbacks: default
  - override /logger: default

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "MURaMQS"  # Experiment
task_seed: 3110  # For reproducibility

# Paths
paths:
  run_id: "DeepVel_z384_t01_lr001_augment_BxBy_vxvy"  # Run ID
  task_dir: "../tracking_outputs"  # Task directory

# Trainer configuration
trainer:
  min_epochs: 1  # To prevent early stopping
  max_epochs: 64  # Number of epochs

# Model configuration
model:
  # Parameters for the model
  n_in_channels: 4
  n_out_channels: 2
  n_conv_layers: 20
  n_filters: 64
  kernel_size: 3
  # Optimizer
  optimizer:
    _target_: torch.optim.Adam  # Optimizer function
    _partial_: True  # Partial initialization
    lr: 1.e-3  # Learning rate

# Loader
loader:
  # Input data
  input:
    # Dataset
    - dataset: ${data.dataset.yz}
      # Variables
      variables:
        Bx: ${data.dataset.yz.variables.Bx}
        By: ${data.dataset.yz.variables.By}
        # Bz: ${data.dataset.yz.variables.Bz}
        # vz: ${data.dataset.yz.variables.vz}
      # Heights
      slices: [384]
      # Time steps
      dt: [0, 1]
    #- dataset: ${data.dataset.I500}
    #  # Variables
    #  variables:
    #    I500: ${data.dataset.I500.variables.I500}
    #  # Heights
    #  slices: [0]
    #  # Time steps
    #  dt: [0, 1]
  # Output data
  output:
    # Dataset
    - dataset: ${data.dataset.yz}
      # Variables
      variables:
        vx: ${data.dataset.yz.variables.vx}
        vy: ${data.dataset.yz.variables.vy}
      # Heights
      slices: [384]
      # Time steps
      dt: [0]
  # Split
  split:
    # Number of samples to use for training
    train: 25600
    # Number of samples to use for validation
    valid: 6400
    # Number of samples to use for testing (0 = use all remaining data, excluding train and valid patches)
    test: 0
    # Batch size when training
    batch_size: 32
    # Patches to use for training
    patches: ${data.preparation.colocate.output.patches.path}
  # Apply geometric augmentation in the x/y plane
  augment: true

# Data configuration
data:
  # Preparation steps
  preparation:
    # Training set patches
    colocate:
      # Input
      input:
        # Data source
        data: ${loader.input[0].dataset.io}
        # Patches
        patches:
          # Number of samples
          n_samples: 32000