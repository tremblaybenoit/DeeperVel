# @package _global_
# Experiment-specific Hydra structure

# Overriding default structure
defaults:
  - override /data: MURaMQS
  - override /paths: default
  - override /hydra: default
  - override /model: linear
  - override /trainer: cpu
  - override /callbacks: default
  - override /logger: default

# All parameters below will be merged with parameters from default configurations set above.
# This allows you to overwrite only specified parameters

# Task name. Note that it determines the output directory path
task_name: "debug"  # Experiment
task_seed: 3210  # For reproducibility

# Data location
data:
  dir: "../data/MURaMQS/debug"
  split:
    n_samples: 6000  # Number of samples

# Logger
logger:
  offline: True  # Save logs to file
  ui: False  # Open the logger UIs
  project_name: ${task_name}  # Project name
  name: "training"  # Name of the logging instance
  mlflow:
    experiment_name: ${logger.project_name}  # Name of the experiment
    run_name: ${logger.name}  # Name of the run
  tensorboard:
    name: ${logger.name}  # Name of the run
  wandb:
    project: ${logger.project_name}  # Name of the project
    name: ${logger.name} # Name of the run